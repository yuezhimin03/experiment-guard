[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-guard"
version = "1.0.0"
description = "A dependency-free A/B experiment evaluator for live game operations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "志民" }]
keywords = ["ab-testing", "cuped", "game-analytics", "experimentation"]

[project.scripts]
experiment-guard = "experiment_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["experiment_guard*"]

